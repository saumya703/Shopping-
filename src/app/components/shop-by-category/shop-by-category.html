<section class="category-section" aria-labelledby="category-title">
  <div class="section-heading">
    <span class="eyebrow">Find your signature</span>
    <h2 id="category-title">Shop by category</h2>
    <p>Explore thoughtfully chosen pieces for every style and occasion.</p>
  </div>

  <div class="category-grid">
    @for (category of categories; track category.name) {
      <a
        class="category-card"
        routerLink="/"
        [queryParams]="{ category: category.name, q: null }"
        fragment="collection"
        [attr.aria-label]="'Shop ' + category.name"
      >
        <span class="category-image">
          <img
            [src]="category.imageUrl"
            [alt]="category.imageAlt"
            loading="lazy"
            width="480"
            height="560"
          />
          <span class="category-arrow" aria-hidden="true">↗</span>
        </span>
        <span class="category-name">{{ category.name }}</span>
      </a>
    }
  </div>
</section>
